<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header navbar navbar-expand-sm">
    <div class="container-fluid nav-row navbar-container">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#site-navigation" aria-controls="site-navigation" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <nav class="nav collapse navbar-collapse justify-content-sm-end" id="site-navigation">
        <a class="nav-link" href="{{ '/' | relative_url }}">Home</a>
        <a class="nav-link social-link" href="https://github.com/robwildgoose" target="_blank" rel="noopener" aria-label="GitHub profile">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 .7a11.3 11.3 0 0 0-3.57 22c.57.1.78-.25.78-.55v-2.08c-3.18.69-3.85-1.35-3.85-1.35-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.69.08-.69 1.15.08 1.75 1.18 1.75 1.18 1.02 1.75 2.68 1.24 3.33.95.1-.74.4-1.24.72-1.52-2.54-.29-5.21-1.27-5.21-5.65 0-1.25.44-2.27 1.18-3.07-.12-.29-.51-1.45.11-3.02 0 0 .96-.31 3.12 1.17A10.86 10.86 0 0 1 12 6.3c.96 0 1.93.13 2.84.38 2.16-1.48 3.12-1.17 3.12-1.17.62 1.57.23 2.73.11 3.02.74.8 1.18 1.82 1.18 3.07 0 4.39-2.67 5.36-5.22 5.64.41.36.77 1.06.77 2.14v3.17c0 .31.21.66.79.55A11.3 11.3 0 0 0 12 .7Z"/>
          </svg>
        </a>
        <a class="nav-link social-link" href="https://www.linkedin.com/in/robert-w-2031a183/" target="_blank" rel="noopener" aria-label="LinkedIn profile">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.47-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14ZM7.12 20.45H3.55V9h3.57v11.45Z"/>
          </svg>
        </a>
        
      </nav>
    </div>
  </header>

  {% if page.banner %}
  <div class="page-banner" role="img" aria-label="{{ page.banner_alt | default: page.title }}">
    <img src="{{ page.banner | relative_url }}" alt="{{ page.banner_alt | default: page.title | escape }}">
  </div>
  {% endif %}

  <main class="container-fluid main-content">
    <div class="row g-0 justify-content-center">
        {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container-fluid">
      <p>© {{ "now" | date: "%Y" }} {{ site.title }} ·</a></p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
